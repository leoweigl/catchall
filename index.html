<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>catchall</title>
  <script type="module" src="/src/main.ts"></script>
</head>

<body>

  <header>

    <h1>
      Catchall
    </h1>

    <button type="button">Review</button>

  </header>

  <main>

    <form>

      <label>
        <textarea name="thoughts" placeholder="what's on your mind?"></textarea>
        Input your thoughts here.
      </label>

      <fieldset>

        <legend>Urgency</legend>

        <label>
          <input type="radio" name="urgency" value="now">
          Now
        </label>

        <label>
          <input type="radio" name="urgency" value="soon">
          Soon
        </label>

        <label>
          <input type="radio" name="urgency" value="someday">
          Someday
        </label>

      </fieldset>

      <fieldset>

        <legend>Weight</legend>

        <label>
          <input type="radio" name="weight" value="heavy">
          Weighs on me
        </label>

        <label>
          <input type="radio" name="weight" value="busy">
          On my mind
        </label>

        <label>
          <input type="radio" name="weight" value="light">
          No big deal
        </label>

      </fieldset>

      <fieldset>

        <legend>Kind</legend>

        <label>
          <input type="radio" name="kind" value="idea">
          Idea
        </label>

        <label>
          <input type="radio" name="kind" value="worry">
          Worry
        </label>

        <label>
          <input type="radio" name="kind" value="reminder">
          Reminder
        </label>

        <label>
          <input type="radio" name="kind" value="question">
          Question
        </label>

      </fieldset>

      <input type="submit" value="Save">

    </form>

  </main>

</body>

</html>

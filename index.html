<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>catchall</title>
  <script type="module" src="/src/main.ts"></script>
</head>

<body class="flex flex-col px-4 bg-mist-100 text-mist-900">

  <header class="flex justify-between py-4">

    <h1 class="text-2xl font-bold">
      catchall
    </h1>

    <button type="button"
      class="text-orange-900 bg-orange-50 shadow-md shadow-mist-300 hover:bg-orange-900 hover:text-white hover:cursor-pointer px-3 py-1 rounded-xl">Review</button>

  </header>

  <main class="flex justify-center">

    <form class="flex flex-col gap-2 w-full max-w-xl">

      <label>
        <textarea name="thoughts" placeholder="what's on your mind?"
          class="resize-none shadow-md shadow-mist-300 bg-orange-50 text-slate-800 rounded-xl p-4 w-full h-32 overflow-auto"></textarea>
        <span class="sr-only">Your thoughts</span>
      </label>

      <fieldset class="min-w-0">

        <div class="flex flex-col gap-2">

          <p class="font-semibold">Urgency</p>

          <div class="flex gap-2 items-center flex-wrap">

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="urgency" value="now" class="sr-only">
              Now
            </label>

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="urgency" value="soon" class="sr-only">
              Soon
            </label>

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="urgency" value="someday" class="sr-only">
              Someday
            </label>

          </div>

        </div>

      </fieldset>

      <fieldset class="min-w-0">

        <div class="flex flex-col gap-2">

          <p class="font-semibold">Weight</p>

          <div class="flex gap-2 items-center flex-wrap">

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="weight" value="heavy" class="sr-only">
              Heavy
            </label>

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="weight" value="medium" class="sr-only">
              On my mind
            </label>

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="weight" value="light" class="sr-only">
              No big deal
            </label>

          </div>

        </div>

      </fieldset>

      <fieldset class="min-w-0">

        <div class="flex flex-col gap-2">

          <p class="font-semibold">Kind</p>

          <div class="flex gap-2 items-center flex-wrap">

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="kind" value="idea" class="sr-only">
              Idea
            </label>

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="kind" value="worry" class="sr-only">
              Worry
            </label>

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="kind" value="reminder" class="sr-only">
              Reminder
            </label>

            <label
              class="px-3 py-2 rounded-xl bg-mist-300 hover:bg-mist-400 hover:cursor-pointer has-checked:bg-mist-500 has-checked:text-slate-100 has-focus-visible:ring-2 has-focus-visible:ring-orange-600">
              <input type="radio" name="kind" value="question" class="sr-only">
              Question
            </label>

          </div>

        </div>

      </fieldset>

      <input type="submit" value="Drop it" class="mt-3 font-semibold text-white bg-orange-600 hover:bg-orange-700 rounded-xl text-center py-2 shadow-md shadow-mist-400 active:scale-98 duration-75">

    </form>

  </main>

</body>

</html>

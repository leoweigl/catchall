<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>catchall</title>
  <script type="module" src="/src/main.ts"></script>
</head>

<body class="flex flex-col px-4 bg-mist-200 text-black">

  <header class="flex justify-between py-4">

    <h1 class="text-2xl font-bold">
      catchall
    </h1>

    <button type="button"
      class="text-orange-900 bg-orange-50 shadow-md shadow-mist-300 hover:bg-orange-900 hover:text-white hover:cursor-pointer px-3 py-1 rounded-xl">Review</button>

  </header>

  <main id="main" class="flex justify-center">

    <form class="flex flex-col gap-2 w-full max-w-xl">

      <label>
        <textarea name="thoughts" placeholder="what's on your mind?"
          class="resize-none shadow-md font-semibold shadow-mist-300 bg-orange-50 text-slate-900 rounded-xl p-4 w-full h-32 overflow-auto"></textarea>
        <span class="sr-only">Your thoughts</span>
      </label>

      <div id="optionContainer" class="flex flex-col gap-2"></div>

      <input type="submit" value="Drop it" class="mt-3 font-semibold text-white bg-orange-600 hover:bg-orange-700 rounded-xl text-center py-2 shadow-md shadow-mist-400 active:scale-98 duration-75">

    </form>

  </main>

</body>

</html>
